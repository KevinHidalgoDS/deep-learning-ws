## Problema

- **Tarea**: Clasificación binaria de sentimiento en reseñas de texto (positivo / negativo)
- **Desafío**: Las frases tienen longitud variable y dependencias a largo plazo; los modelos tradicionales (como bolsa de palabras) no capturan el contexto secuencial
- **Por qué LSTM**: Las compuertas de memoria (input / forget / output) permiten retener selectivamente información clave a largo plazo y mitigar el problema del gradiente desvaneciente

Note:
Explicar brevemente por qué RNN simples no son suficientes, destacar el papel de la compuerta de olvido.

---

## Dataset

- **Fuente**: IMDb Movie Reviews (o dataset personalizado de reseñas en español)
- **Tamaño**: 50,000 muestras (25k entrenamiento / 25k prueba), balanceado 50/50
- **Etiquetas**: 1 = positivo, 0 = negativo
- **Longitud**: La mayoría de reseñas entre 100–500 palabras, se trunca/padea a `max_len = 128`

| Split | Muestras | Positivas | Negativas |
|-------|----------|-----------|-----------|
| Train | 20,000   | 10,000    | 10,000    |
| Val   | 5,000    | 2,500     | 2,500     |
| Test  | 25,000   | 12,500    | 12,500    |

Note:
Mencionar que si se usa un dataset en español, se debe ajustar el tokenizador (por ejemplo, con spacy o jieba).

---

## Preprocesamiento

1. **Limpieza**: Eliminar etiquetas HTML, caracteres especiales; unificar minúsculas
2. **Tokenización**: Segmentar por palabras y construir vocabulario (frecuencia mínima 5)
3. **Mapeo a índices**: Convertir palabras a IDs; palabras desconocidas → `<UNK>`; padding → `<PAD>` (índice 0)
4. **Padding / Truncamiento**: Fijar todas las secuencias a longitud 128
5. **Embeddings**: Inicializar con GloVe 100d (opcional), ajuste fino durante el entrenamiento

```python
# Pseudocódigo del flujo de preprocesamiento
indices = [vocab.get(w, UNK_IDX) for w in tokens]
if len(indices) < MAX_LEN:
    indices += [PAD_IDX] * (MAX_LEN - len(indices))
else:
    indices = indices[:MAX_LEN]
```

Note:
Destacar que el padding debe hacerse después del truncamiento, y que <PAD> no participa en el cálculo de la pérdida.

---

## Arquitectura de la red

Modelo LSTM para clasificación de texto

```text
Entrada (batch, 128) 
    ↓
Embedding (vocab_size → 100)
    ↓
LSTM (hidden_size=128, num_layers=2, dropout=0.3, batch_first=True)
    ↓
Último estado oculto h_T (batch, 128)
    ↓
Dropout (0.3)
    ↓
Linear (128 → 1)
    ↓
Sigmoide → Probabilidad (0–1)
```

- Pérdida: BCEWithLogitsLoss

- Optimizador: Adam (lr=1e-3)

- Regularización: Dropout + weight decay 1e-5

Note:
Explicar por qué se toma el último estado oculto en lugar del promedio: en tareas de clasificación de sentimiento, la información al final de la secuencia suele ser más representativa.

--- 

## Entrenamiento

|Hiperparámetro|Valor|
|:---:|:---:|
|Batch size|64|
|Épocas|20 (early stopping patience=3)|
|Learning rate|1e-3 (ReduceLROnPlateau factor=0.5)|
|Gradient clipping|1.0|

Curva de aprendizaje (resumen):

- Época 1–3: pérdida desciende rápidamente de 0.69 → 0.45

- Época 4–10: descenso lento, accuracy de validación sube de 78% → 86%

- Época 11–15: se estabiliza, early stopping en época 14 (mejor val_acc = 87.2%)

Note:
Mencionar que el clipping de gradientes es crucial para el entrenamiento de LSTM, especialmente en las primeras épocas.

## Conclusiones

- LSTM logra 86.8% de accuracy en clasificación binaria de sentimiento, con AUC 0.934

- El mecanismo de compuertas permite modelar dependencias a largo plazo, superando a RNN simples en ~5–8 puntos porcentuales

- Costo: ~12s por época en GPU T4; inferencia ~3ms por muestra (batch=1)

- Mejoras futuras:

    - Probar atención sobre los estados ocultos de LSTM (LSTM + Attention)

    - Reemplazar con Transformer ligero (DistilBERT) y comparar

    - Ajustar el vocabulario para dominio específico (reseñas de productos vs. películas)

## Math: ecuaciones

La compuerta de olvido determina qué información conservar:

<math display="block" aria-label="f sub t igual a sigma de W sub f por h sub t menos uno y x sub t, más b sub f">
  <msub><mi>f</mi><mi>t</mi></msub><mo>=</mo>
  <mi>σ</mi><mo>(</mo><msub><mi>W</mi><mi>f</mi></msub>
  <mo>[</mo><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub>
  <mo>,</mo><msub><mi>x</mi><mi>t</mi></msub><mo>]</mo><mo>+</mo>
  <msub><mi>b</mi><mi>f</mi></msub><mo>)</mo>
</math>

Aquí <math><msub><mi>x</mi><mi>t</mi></msub></math> es la entrada y
<math><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub></math>
es el estado oculto anterior.

## Code: código Python

```python
import torch

lstm = torch.nn.LSTM(input_size=100, hidden_size=128, batch_first=True)
entrada = torch.randn(4, 10, 100)  # lote, pasos de tiempo, características
salida, (estado_oculto, estado_celda) = lstm(entrada)
print(salida.shape)  # torch.Size([4, 10, 128])
```

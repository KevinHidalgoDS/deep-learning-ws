site_name: Deep Learning
site_description: Documentación y laboratorio de Deep Learning
site_author: Milena Castaño, Lissy Grace, Kelly Monsalve, Sebastian Sanchez, Kevin Hidalgo
copyright: "Copyright &copy; 2026 Milena Castaño, Lissy Grace, Kelly Monsalve, Sebastian Sanchez, Kevin Hidalgo - Universidad Nacional de Colombia"

# Enlace al repositorio (crea el botón directo en la cabecera)
repo_name: KevinHidalgoDS/deep-learning-ws
repo_url: https://github.com/KevinHidalgoDS/deep-learning-ws

hooks:
  - hooks/notebooks.py

watch:
  - notebooks

# -----------------------------------------------------------------------------
# TEMA
# -----------------------------------------------------------------------------

theme:
  # name: dracula
  # logo: img/dracula.png
  # favicon: img/favicon.ico
  name: material
  language: es
  font:
    text: Roboto
    code: JetBrainsMono NFM
  palette:
    # Modo claro
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Modo oscuro
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    # Navegación SPA y fluidez
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    # Herramientas de búsqueda y lectura de código
    - search.suggest
    - search.share
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips

plugins:
  - search:
      lang: es
  - mkdocstrings:
      handlers:
        python:
          paths:
            - . # Raíz del proyecto
            - src # Módulos comunes / compartidos
          options:
            docstring_style: google # Compatible con formato Google o NumPy
            members_order: source
            show_root_heading: true
            show_source: true
            show_bases: true
            show_if_no_docstring: true
            separate_signature: true
            merge_init_into_class: true
            show_signature_annotations: true
            # show_attributes: false # <-- Oculta todas las variables y constantes
            filters:
              - "!^_[^_]"             # (Por defecto) Oculta variables privadas con un solo guion bajo
              - "!^__[a-zA-Z0-9_]+__$" # Oculta todas las variables dunder (__version__, __authors__, etc.)
  - mkdocs-jupyter:
      include_source: true
      ignore_h1_titles: true
      execute: false
      remove_tag_config:
        remove_input_tags:
          - hide_code

  # Gestión de referencias y citas académicas mediante BibTeX y CSL
  - bibtex:
      bib_file: "docs/referencias.bib" # Ruta al archivo .bib de Scopus/IEEE/Zotero
      csl_file: "docs/ieee.csl" # Estilo de citación formal IEEE

  # Soporte para galería de imágenes con lightbox (zoom y navegación)
  - glightbox

  # Trazabilidad de Versiones
  - git-revision-date-localized:
      locale: es
      type: timeago # o 'iso_date'

  - revealjs:
      transition: slide
      controls: true

# -----------------------------------------------------------------------------
# EXTENSIONES DE MARKDOWN
# -----------------------------------------------------------------------------

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - def_list
  - abbr
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - footnotes

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KevinHidalgoDS
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kevin-ferney-hidalgo-higuita-752ab5162/
      name: LinkedIn
    - icon: fontawesome/solid/graduation-cap
      link: https://unal.edu.co/
      name: Universidad Nacional de Colombia

nav:
  - Inicio: index.md
  - src:
      - data: src_data.md
  - Cuadernos Jupyter:
      - EDA: notebooks/01_eda_simem_precio_bolsa.ipynb
  - Presentación:
      # - Markdown Reveals: presentacion.md
      # - Reveals: presentacion-html/presentacion.html
      - Jupyter: 02_presentacion.slides.html

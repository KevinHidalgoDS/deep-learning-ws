# Configuración central del pronóstico del precio de bolsa de energía en Colombia.
project:
  name: "simem-energy-price-forecast"
  version: "0.1.0"
  seed: 42

paths:
  data:
    raw: "data/raw/"
    interim: "data/interim/"
    processed: "data/processed/"
    external: "data/external/"
  models:
    trained: "models/trained/"
    checkpoints: "models/checkpoints/"
  reports:
    figures: "reports/figures/"
    metrics: "reports/metrics/"

simem:
  portal_url: "https://www.simem.co/"
  api_base_url: "https://www.simem.co"
  endpoint: "/backend-files/api/PublicData"
  timeout_seconds: 30
  max_retries: 3
  chunk_days: 14
  datasets:
    precio_bolsa:
      dataset_id: EC6945
      timestamp: FechaHora
      value: Valor
      frequency: "1h"
      filters: {CodigoVariable: PB_Nal, CodigoDuracion: PT1H, UnidadMedida: COP/kWh}
      revision: Version
      revision_calendar_id: "24914F"
      revision_as_of: null
    demanda_nacional:
      dataset_id: 14fabb
      timestamp: FechaHora
      value: Valor
      frequency: "1h"
      filters: {CodigoVariable: DdaReal, CodigoDuracion: PT1H, UnidadMedida: kWh}
      revision: Version
      revision_calendar_id: "24914F"
      revision_as_of: null  # Opcional: fecha de corte AAAA-MM-DD inclusive, hora de Colombia.
      revision_fallback: true  # Una sola revisión publicada con cobertura para todo el mes.
      dimensions: [CodigoSICAgente, TipoMercado]
      aggregate: true
    aportes_hidricos:
      dataset_id: BA1C55
      timestamp: Fecha
      value: AportesHidricosEnergia
      frequency: "1D"
      dimensions: [CodigoSerieHidrologica]
    generacion_real:
      dataset_id: E17D25
      timestamp: Fecha
      value: GeneracionRealEstimada
      frequency: "1D"
      filters: {TipoGeneracion: [Hidraulica, Termica]}
      dimensions: [TipoGeneracion, CodigoPlanta]
      group_by: [TipoGeneracion]
      aggregate: true

data:
  target_column: "precio_bolsa"
  timestamp_column: "fecha"
  frequency: "1h"
  timezone: "America/Bogota"
  window:
    start: "2026-06-01"
    end: "2026-09-30"

preprocess:
  # Imputación causal: solo hacia adelante (ffill) y con un límite de pasos consecutivos.
  max_gap_hours: 6
  max_gap_days: 2
  # Un dato diario del día D (aportes, generación) se publica al cierre del día:
  # solo se usa como predictor desde las 00:00 de D + daily_publication_lag_days.
  daily_publication_lag_days: 1

features:
  # Rezagos en horas según el EDA (notebook 01, ACF/PACF): persistencia fuerte en 1 h
  # y picos estacionales en 24, 48 y 168 h.
  lags: [1, 24, 48, 168]
  # La serie es I(1): las diferencias regular (1 h) y diaria (24 h) estabilizan el nivel.
  differences: [1, 24]
  rolling_windows: [24, 168]
  rolling_quantiles: [0.1, 0.5, 0.9]
  cyclical: [hour, dayofweek, month]
  scaler: "robust"  # robust | standard; robust por la asimetría y los picos de precio.
  scaler_file: "scaler.pkl"

training:
  seed: 42
  lookback_steps: 168
  forecast_horizon: 24
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  num_workers: 0
  device: "auto"
  # Sprint 3: entrenamiento de las redes (src/models/train_model.py).
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 1.0
  lr_scheduler:
    factor: 0.5      # ReduceLROnPlateau: multiplica la tasa por este factor...
    patience: 4      # ...tras estas épocas sin mejorar la pérdida de validación.
    min_lr: 0.00001

models:
  # Arquitecturas profundas a comparar contra el baseline (src/models/architectures.py).
  architectures: [lstm_attention, tcn, nbeats]
  # huber: robusta ante picos de precio. quantile: produce intervalos de predicción.
  loss: "huber"
  huber_delta: 1.0
  quantiles: [0.1, 0.5, 0.9]  # Solo con loss: quantile; debe incluir 0.5 (pronóstico puntual).
  baseline:
    ridge_alpha: 10.0
  lstm_attention:
    hidden_units: 64
    num_layers: 2
    dropout: 0.2
  tcn:
    hidden_units: 32   # Canales por capa convolucional.
    levels: 6          # Dilataciones 1..32: campo receptivo de 253 h >= lookback de 168 h.
    kernel_size: 3
    dropout: 0.2
  nbeats:
    hidden_units: 256
    num_blocks: 3
    layers_per_block: 4
    dropout: 0.1

optimization:
  # Búsqueda de hiperparámetros con Optuna (src/models/optimize.py).
  n_trials: 20             # Por arquitectura.
  epochs: 40               # Máximo por prueba; el early stopping suele cortar antes.
  timeout_minutes: null    # Límite opcional por arquitectura.
  # Métrica de selección del campeón: MAE de validación en COP/kWh (nunca la de prueba).
  search_space:
    learning_rate: [0.0001, 0.01]     # Muestreo logarítmico.
    lookback_steps: [48, 96, 168]     # Recorta la ventana guardada; máximo training.lookback_steps.
    hidden_units: [32, 64, 128, 256]
    dropout: [0.0, 0.5]

evaluation:
  # Sprint 4: evaluación fuera de muestra (src/models/predict_model.py).
  # Persistencias estacionales de referencia, en horas: misma hora de ayer y de la semana pasada.
  naive_seasons: [24, 168]
  # MAPE con denominador acotado: |real - pronóstico| / max(|real|, piso). Evita que un precio
  # cercano a cero (o negativo) dispare el porcentaje. El piso está en COP/kWh.
  mape_floor_cop: 50.0
  # Horas de punta del SIN (demanda máxima de la tarde-noche), hora de Colombia.
  peak_hours: [18, 19, 20, 21]
  figures_subdir: "evaluacion"
  # Gradientes integrados (src/visualization/visualize.py).
  integrated_gradients_steps: 64
  dpi: 300

environment:
  nombre: "PRB"  # PRD
  entorno: "local"  # nube
  ide: "PyCharm"

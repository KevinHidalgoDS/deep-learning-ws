# Configuración central del pronóstico del precio de bolsa de energía en Colombia.
project:
  name: "simem-energy-price-forecast"
  version: "0.1.0"
  seed: 42

paths:
  data:
    raw: "data/raw/"
    interim: "data/interim/"
    processed: "data/processed/"
    external: "data/external/"
  models:
    trained: "models/trained/"
    checkpoints: "models/checkpoints/"
  reports:
    figures: "reports/figures/"

simem:
  portal_url: "https://www.simem.co/"
  api_base_url: null
  endpoint: null
  dataset_id: null
  token_env_var: "SIMEM_API_TOKEN"
  timeout_seconds: 30
  max_retries: 3

data:
  target_column: "precio_bolsa"
  timestamp_column: "fecha"
  frequency: "1h"
  timezone: "America/Bogota"
  window:
    start: null
    end: null

training:
  seed: 42
  lookback_steps: 168
  forecast_horizon: 24
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  num_workers: 0
  device: "auto"

environment:
  nombre: "PRB"  # PRD
  entorno: "local"  # nube
  ide: "PyCharm"
